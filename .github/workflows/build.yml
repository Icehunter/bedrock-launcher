name: build

on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: macos-15
    timeout-minutes: 300
    env:
      # Version tags and manual runs are signed with the Developer ID and
      # notarized; other pushes are ad-hoc signed.
      RELEASE_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ANGLE is cloned without its own submodules; gclient fetches what it needs.
      - name: Submodules
        run: |
          git submodule update --init --depth 1 deps/angle deps/MoltenVK
          git submodule update --init --recursive deps/mcpelauncher-manifest deps/mcpelauncher-updates

      - name: Tools
        run: brew install cmake ninja

      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370" >/dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/30.0.16248370" >>"$GITHUB_ENV"

      - name: Submodule commits
        id: commits
        run: |
          echo "angle=$(git -C deps/angle rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          echo "moltenvk=$(git -C deps/MoltenVK rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          echo "macos=$(cat scripts/macos-min-version)" >>"$GITHUB_OUTPUT"

      - name: Cache ANGLE
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/angle
          key: angle-${{ steps.commits.outputs.angle }}-macos-${{ steps.commits.outputs.macos }}

      - name: Cache MoltenVK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/moltenvk
          key: moltenvk-${{ steps.commits.outputs.moltenvk }}-macos-${{ steps.commits.outputs.macos }}

      - name: Free disk before building
        run: df -h /

      - name: Signing keychain
        if: env.RELEASE_BUILD == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode >"$RUNNER_TEMP/cert.p12"
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security add-certificates -k "$KEYCHAIN" "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          test -n "$IDENTITY"
          echo "SIGN_IDENTITY=$IDENTITY" >>"$GITHUB_ENV"

      - name: Build
        run: scripts/build.sh

      - name: Disk image
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [ "$RELEASE_BUILD" = true ]; then
            export NOTARY_KEY_FILE="$RUNNER_TEMP/notary.p8"
            echo "$NOTARY_KEY_P8" | base64 --decode >"$NOTARY_KEY_FILE"
          fi
          scripts/make-dmg.sh
          rm -f "$RUNNER_TEMP/notary.p8"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Bedrock-Launcher
          path: out/Bedrock-Launcher.dmg
          if-no-files-found: error

      - name: Remove signing keychain
        if: always() && env.RELEASE_BUILD == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
