<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Play Minecraft Bedrock on Apple Silicon Macs. Get the game from Google Play with your own account, or move your copy over from your other Mac." />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#1E2229" />
    <title>Bedrock Launcher: Minecraft Bedrock on your Mac</title>
    <link rel="icon" type="image/png" href="./icon.png" />
    <link rel="apple-touch-icon" href="./icon.png" />
    <script>
      (function () {
        try {
          var dark = localStorage.getItem("bl-theme") !== "light";
          var r = document.documentElement;
          r.classList.add(dark ? "dark" : "light");
          r.setAttribute("data-theme", dark ? "dark" : "light");
        } catch (e) {
          document.documentElement.classList.add("dark");
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
